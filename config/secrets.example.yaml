# MẪU KEY AI. Sao chép file này thành config/secrets.yaml rồi điền key vào đúng dòng cần dùng.
# KHÔNG BAO GIỜ đưa config/secrets.yaml lên git hoặc gửi cho người khác (gói chia sẻ không chứa nó).
# Chỉ cần điền key của AI bạn chọn trong config/ai.yaml; để trống các dòng còn lại.

anthropic_api_key: ""          # Claude API (provider: anthropic)
gemini_api_key: ""             # Google Gemini API (provider: gemini)
deepseek_api_key: ""           # DeepSeek API (provider: deepseek)
openrouter_api_key: ""         # OpenRouter (provider: openrouter)
openai_compatible_api_key: ""  # máy chủ tương thích OpenAI, chỉ khi máy chủ đó đòi key (provider: openai_compatible)
ollama_api_key: ""             # Ollama, chỉ khi máy chủ Ollama ở xa đòi key (provider: ollama)
