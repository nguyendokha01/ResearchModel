# Synonym groups used to expand searches.
# When you search for any term in a group, all terms in that group are searched.
# One group per line, as a list. Matching is case-insensitive.
# Add groups only when you have checked that the terms really are equivalent.
#
# Example format (remove the # to activate):
# - [CDK1, cyclin-dependent kinase 1, p34cdc2]
# - [MMP, mitochondrial membrane potential]

